name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deploy (manual runs only)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Manual confirmation (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Invalid confirmation value. Type DEPLOY to continue."
            exit 1
          fi

      - name: Set image for prod
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            fi
            cd /var/www/henzo/apps/backend
            # Promote verified staging image to production by digest (no rebuild).
            docker pull ${{ env.IMAGE_BASE }}:staging
            DIGEST_REF=$(docker image inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}:staging)
            if [ -z "$DIGEST_REF" ]; then
              echo "❌ Failed to resolve digest from staging image"
              exit 1
            fi
            export BACKEND_IMAGE=${DIGEST_REF}
            echo "🔄 Pulling image..."
            docker compose pull backend
            echo "🔄 Restarting backend..."
            docker compose up -d --no-deps backend
            docker compose up -d --no-deps nginx
            echo "⏳ Waiting for startup..."
            sleep 10
            echo "🔍 Health check..."
            curl -f http://localhost/health || exit 1
            echo "✅ Deployment complete!"
            docker compose ps

      - name: Notify success
        if: success()
        run: echo "✅ Backend deployed successfully!"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          exit 1
