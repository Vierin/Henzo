name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image base (lowercase for Docker)
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:prod

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Set image for prod
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_FULL=${BASE}:latest" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/henzo
            git pull origin main
            cd apps/backend
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            fi
            export BACKEND_IMAGE=${{ env.IMAGE_FULL }}
            echo "🔄 Pulling image..."
            docker compose pull backend
            echo "🔄 Restarting backend..."
            docker compose up -d --no-deps backend
            docker compose up -d --no-deps nginx
            echo "⏳ Waiting for startup..."
            sleep 10
            echo "🔍 Health check..."
            curl -f http://localhost/health || exit 1
            echo "✅ Deployment complete!"
            docker compose ps

      - name: Notify success
        if: success()
        run: echo "✅ Backend deployed successfully!"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          exit 1
