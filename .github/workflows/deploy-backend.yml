name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deploy (manual runs only)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Manual confirmation (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Invalid confirmation value. Type DEPLOY to continue."
            exit 1
          fi

      - name: Set image for prod
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            GHCR_USER="${{ secrets.GHCR_USERNAME }}"
            [ -n "$GHCR_USER" ] || GHCR_USER="${{ github.repository_owner }}"
            [ -n "${{ secrets.GHCR_TOKEN }}" ] || { echo "❌ GHCR_TOKEN secret is missing"; exit 1; }
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "$GHCR_USER" --password-stdin

            APP_DIR="/var/www/henzo"
            BACKEND_DIR="$APP_DIR/apps/backend"

            [ -d "$APP_DIR/.git" ] || { echo "Git repo not found at $APP_DIR (.git missing)"; exit 1; }
            [ -f "$BACKEND_DIR/docker-compose.yml" ] || { echo "docker-compose.yml not found at $BACKEND_DIR"; exit 1; }
            [ -f "$BACKEND_DIR/deploy/deploy-compose-service.sh" ] || { echo "deploy script not found"; exit 1; }

            git -C "$APP_DIR" fetch origin
            git -C "$APP_DIR" checkout main
            git -C "$APP_DIR" pull --ff-only origin main

            cd "$BACKEND_DIR"
            docker compose -f docker-compose.yml config --services \
              | tr -d '\r' \
              | grep -Fxq "backend" \
              || { echo "Service backend not found in docker-compose.yml"; exit 1; }

            docker pull ${{ env.IMAGE_BASE }}:staging
            IMAGE_REF=$(docker image inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}:staging)
            if [ -z "$IMAGE_REF" ]; then
              echo "❌ Failed to resolve digest from staging image"
              exit 1
            fi

            bash deploy/deploy-compose-service.sh --env=production --image="$IMAGE_REF" --migrate=true
            echo "✅ Production deployment complete!"

      - name: Notify success
        if: success()
        run: echo "✅ Backend deployed successfully!"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          exit 1
