name: Deploy Backend (staging) to DigitalOcean

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend-staging.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push staging image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image base (lowercase)
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}:staging

      - name: Save image digest artifact
        run: echo "${{ steps.build.outputs.digest }}" > backend-staging-digest.txt

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-image-digest
          path: backend-staging-digest.txt

  deploy:
    name: Deploy staging to server
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Set image base
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=${{ needs.build-and-push.outputs.image_digest }}" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u Vierin --password-stdin
            fi

            APP_DIR="/var/www/henzo"
            BACKEND_DIR="$APP_DIR/apps/backend"

            [ -d "$APP_DIR/.git" ] || { echo "Git repo not found at $APP_DIR (.git missing)"; exit 1; }
            [ -f "$BACKEND_DIR/docker-compose.yml" ] || { echo "docker-compose.yml not found at $BACKEND_DIR"; exit 1; }
            [ -f "$BACKEND_DIR/deploy/deploy-compose-service.sh" ] || { echo "deploy script not found at $BACKEND_DIR/deploy/deploy-compose-service.sh"; exit 1; }

            git -C "$APP_DIR" fetch origin
            git -C "$APP_DIR" checkout staging
            # reset --hard: deploy server must match remote exactly (pull fails on
            # untracked files that were added to the repo, e.g. setup-certbot-auto-renew.sh)
            git -C "$APP_DIR" reset --hard origin/staging

            cd "$BACKEND_DIR"
            docker compose -f docker-compose.yml config --services \
              | tr -d '\r' \
              | grep -Fxq "backend_staging" \
              || { 
                echo "Service backend_staging not found in $BACKEND_DIR/docker-compose.yml"
                docker compose -f docker-compose.yml config --services | sed -n 'l'
                exit 1
              }
            IMAGE_REF="${{ env.IMAGE_BASE }}@${{ env.IMAGE_DIGEST }}"
            if ! docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then
              echo "Digest not found, fallback to :staging"
              IMAGE_REF="${{ env.IMAGE_BASE }}:staging"
            fi

            bash deploy/deploy-compose-service.sh --env=staging --image="$IMAGE_REF" --migrate=true
            echo "✅ Staging deployment complete!"
