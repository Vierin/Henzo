name: Deploy Backend with Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging branch or main branch)'
        required: true
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Run database migrations?'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy with migrations
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Set image base
        run: |
          BASE="${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/backend"
          echo "IMAGE_BASE=${BASE}" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/henzo/apps/backend

            GHCR_USER="${{ secrets.GHCR_USERNAME }}"
            [ -n "$GHCR_USER" ] || GHCR_USER="${{ github.repository_owner }}"
            [ -n "${{ secrets.GHCR_TOKEN }}" ] || { echo "❌ GHCR_TOKEN secret is missing"; exit 1; }
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "$GHCR_USER" --password-stdin

            if [ "${{ inputs.environment }}" = "staging" ]; then
              SERVICE=backend_staging
              export IMAGE_REF=${{ env.IMAGE_BASE }}:staging
              HEALTH='curl -fsS -H "Host: api-staging.henzo.app" http://127.0.0.1/health'
            else
              SERVICE=backend
              docker pull ${{ env.IMAGE_BASE }}:staging
              IMAGE_REF=$(docker image inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_BASE }}:staging)
              if [ -z "$IMAGE_REF" ]; then
                echo "❌ Failed to resolve digest from staging image"
                exit 1
              fi
              export IMAGE_REF
              HEALTH='curl -fsS http://127.0.0.1/health'
            fi

            if [ "$SERVICE" = "backend_staging" ]; then
              export BACKEND_STAGING_IMAGE=$IMAGE_REF
            else
              export BACKEND_IMAGE=$IMAGE_REF
            fi

            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              echo "🔍 Migration precheck ($SERVICE)..."
              docker compose run --rm "$SERVICE" npx prisma migrate status
              echo "📊 Running migrations ($SERVICE)..."
              docker compose run --rm "$SERVICE" npx prisma migrate deploy
            fi

            echo "🔄 Pulling image ($SERVICE)..."
            docker compose pull "$SERVICE"
            echo "🔄 Recreating service ($SERVICE)..."
            docker compose up -d --no-deps "$SERVICE"
            docker compose up -d --no-deps nginx

            echo "⏳ Waiting for startup..."
            sleep 15

            echo "🔍 Health check..."
            eval "$HEALTH"

            echo "✅ Done ($SERVICE)"
            docker compose ps

      - name: Send notification on success
        if: success()
        run: echo "✅ Deploy with migrations succeeded (${{ inputs.environment }})"

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Deploy with migrations failed!"
          exit 1
